<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desk Occupancy Monitoring System</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: white;
            min-height: 100vh;
            padding: 60px;
            color: #1f2937;
        }

        h1 {
            color: #004684;
            font-size: 48px;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #004684;
            font-size: 18px;
            font-weight: 200;
            text-decoration: underline;
            text-decoration-color: #fdb927;
            margin-bottom: 40px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 40px;
            color: #004684;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: 2px solid #004684;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background-color: #004684;
            color: #fdb927;
        }

        /* Feed grid — two columns */
        .feeds-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .feed-card {
            border: 2px solid black;
            overflow: hidden;
        }

        /* Floor label bar above each feed */
        .feed-header {
            background-color: #004684;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feed-floor-name {
            color: #fdb927;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .feed-people-count {
            color: white;
            font-size: 15px;
            font-weight: 400;
        }

        .feed-people-count span {
            font-weight: 600;
            color: #fdb927;
        }

        /* The actual video feed */
        .feed-card img {
            width: 100%;
            display: block;
            background-color: #111;
            min-height: 280px;
            object-fit: cover;
        }

        /* Footer bar below each feed — last updated */
        .feed-footer {
            background-color: #f5f5f5;
            border-top: 1px solid #ddd;
            padding: 10px 20px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 900px) {
            .feeds-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 30px;
            }
            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <h1>Desk Occupancy<br>Detection System</h1>
    <div class="subtitle">Admin Dashboard — Live Feeds</div>

    <a href="{{ url_for('room_selection') }}" class="back-link">&larr; Return to Building Selection</a>

    <div class="feeds-grid">

       <div class="feed-card">
            <div class="feed-header">
                <div class="feed-floor-name">CAM 1</div>
                <div class="feed-people-count">People detected: <span id="people-cam1">0</span></div>
            </div>
            <img src="{{ url_for('video_feed', cam_id='cam1') }}" alt="Floor 2 Camera Feed">
            <div class="feed-footer">Last updated: <span id="timestamp-cam1">—</span></div>
        </div>

        <div class="feed-card">
            <div class="feed-header">
                <div class="feed-floor-name">CAM 2</div>
                <div class="feed-people-count">People detected: <span id="people-cam2">0</span></div>
            </div>
            <img src="{{ url_for('video_feed', cam_id='cam2') }}" alt="Floor 3 Camera Feed">
            <div class="feed-footer">Last updated: <span id="timestamp-cam2">—</span></div>
        </div>

         <div class="feed-card">
            <div class="feed-header">
                <div class="feed-floor-name">CAM 3</div>
                <div class="feed-people-count">People detected: <span id="people-cam2">0</span></div>
            </div>
            <img src="{{ url_for('video_feed', cam_id='cam3') }}" alt="Floor 3 Camera Feed">
            <div class="feed-footer">Last updated: <span id="timestamp-cam2">—</span></div>
        </div>

    </div>

    <script>
        const socket = io();

        socket.on('occupancy_update_cam1', function(data) {
            document.getElementById('people-cam1').textContent = data.total_people;
            document.getElementById('timestamp-cam1').textContent = data.last_updated || '—';
        });

        socket.on('occupancy_update_cam2', function(data) {
            document.getElementById('people-cam2').textContent = data.total_people;
            document.getElementById('timestamp-cam2').textContent = data.last_updated || '—';
        });

        socket.on('connect_error', function() {
            console.log('Socket connection failed');
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;600&display=swap" rel="stylesheet">

    <title> Library 2nd Floor</title>
    <style>
        body {
            font-family: 'Montserrat', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 95vw;
            max-width: 1800px; 
        }
        h1 {
            margin-bottom: 20px;
        }
        svg {
            width: 100%;
            height: auto;
            max-height: 120vh;
            display: block;
        }
        /* Interactivity Styles */
        rect[id^="desk-shape"] {
            cursor: pointer;
            transition: fill 0.2s ease;
        }
        rect[id^="desk-shape"]:hover {
            stroke: #3b82f6;
            stroke-width: 5px;
        }
        text {
            pointer-events: none; 
            user-select: none;
        }

        .highlight-desk {
            stroke: #fdb927 !important; 
            stroke-width: 12px !important;
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }
        rect[id^="desk-shape"]:hover {
        filter: brightness(1.2);
        cursor: pointer;
}
    </style>
</head>
<body>

    <h1>Library 2nd Floor Map</h1>
    <div style="margin-bottom: 20px; display: flex; gap: 10px;">
        <a href="{{ url_for('room_selection') }}" style="padding: 10px; background: #ddd; text-decoration: none; border-radius: 5px; color: black;">Return to room selection</a>
        
    </div>

    <div id="cameraContainer" style="display: none; margin-bottom: 20px; text-align: center;">
        <img id="videoFeed" src="{{ url_for('video_feed', cam_id='cam1') }}" style="width: 640px; border: 3px solid #1e293b; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
    </div>

    
    <div class="container">
        {% if session.get('role') == 'admin' %}
<div style="margin-bottom: 20px; display: flex; gap: 10px; justify-content: center;">
    <button id="btn-cam1" class="admin-btn">Show Feed: Desks 1-4</button>
    <button id="btn-cam2" class="admin-btn">Show Feed: Desks 5-10</button>
    <button id="btn-cam3" class="admin-btn">Show Feed: Desks 11-14</button>

</div>

<div id="video-wrapper" style="display: none; text-align: center; margin-bottom: 20px;">
    <h3 id="cam-label" style="color: #004684; margin-bottom: 10px;">Camera Feed</h3>
    <img id="active-video-feed" src="" style="width: 100%; max-width: 800px; border: 5px solid #004684; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
</div>
{% endif %}

<script>
    const socket = io();
    const cameraDiv = document.getElementById('cameraContainer');

 socket.on('occupancy_update', (data) => {
    console.log("Received update:", data);
    
    Object.keys(data.desks).forEach(deskName => {
        const isOccupied = data.desks[deskName].occupied;
        
        const idNum = deskName.split(' ')[1];
        
        const elementId = idNum === "1" ? "desk-shape" : `desk-shape_${idNum}`;
        const deskElement = document.getElementById(elementId);
        
        if (deskElement) {
            deskElement.style.fill = isOccupied ? "red" : "#00F265";
        }
    });
});

{% if session.get('role') == 'admin' %}
            const videoWrapper = document.getElementById('video-wrapper');
            const videoImg = document.getElementById('active-video-feed');
            const camLabel = document.getElementById('cam-label');

            function toggleFeed(camId, label) {
    const videoWrapper = document.getElementById('video-wrapper');
    const videoImg = document.getElementById('active-video-feed');
    const camLabel = document.getElementById('cam-label');

    document.querySelectorAll('rect[id^="desk-shape"]').forEach(rect => {
        rect.classList.remove('highlight-desk');
    });

    if (videoWrapper.style.display === 'block' && videoImg.src.includes(camId)) {
        videoWrapper.style.display = 'none';
        videoImg.src = "";
    } else {
        videoWrapper.style.display = 'block';
        videoImg.src = `/video_feed/${camId}`;
        camLabel.textContent = "Live View: " + label;

        let start, end;
        if (camId === 'cam1') {
            start = 1; end = 4;
        } else if (camId === 'cam2') {
            start = 5; end = 10;
        } else if (camId === 'cam3') {
            start = 11; end = 14;
        }
        for (let i = start; i <= end; i++) {
            let elementId = (i === 1) ? "desk-shape" : `desk-shape_${i}`;
            const deskElement = document.getElementById(elementId);
            if (deskElement) {
                deskElement.classList.add('highlight-desk');
            }
        }
    }
}
